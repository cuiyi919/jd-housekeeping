name: Publish household PWA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'assets/housekeeping-icon.png'
      - 'scripts/build-pwa.cjs'
      - 'tests/pwa.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pwa.yml'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec playwright install --with-deps chromium
      - run: npm run build:page
      - run: npm run lint && npm run typecheck && npm test && npm run test:pwa
      - run: node scripts/build-pwa.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pwa
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
